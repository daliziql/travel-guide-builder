<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>住宿选型工作台 · 哈萨克斯坦 2026 国庆</title>
<style>
  :root{--paper:#f4f2ec;--card:#fff;--ink:#22302c;--sub:#66736e;--line:#e4dfd4;
    --jade:#2e7d6b;--jade-soft:#e4f0ec;--sky:#3a7ca5;--sky-soft:#e7f0f5;--clay:#d08a3c;
    --clay-soft:#faf0e1;--rose:#c2553d;--rose-soft:#fbe9e4;--slate:#4f6d7a;--slate-soft:#e9eff1;--gold:#b08900;--gold-soft:#f8f1dc}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--paper);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1180px;margin:0 auto;padding:0 20px 80px}
  a{color:var(--sky)}
  .hero{background:linear-gradient(125deg,#1d5b53,#2e7d6b 55%,#3a7ca5);color:#fff;border-radius:0 0 26px 26px;padding:38px 34px 30px;margin:0 -20px 20px}
  .hero h1{font-size:26px;margin:6px 0}.hero .meta{font-size:13.5px;opacity:.95}
  .hero .back{display:inline-block;margin-bottom:8px;font-size:12.5px;color:#eafaf4;text-decoration:none;border:1px solid rgba(255,255,255,.4);padding:3px 12px;border-radius:20px}
  /* 需求总览 */
  .need{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}
  .need .n{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 16px}
  .need b{font-size:16px;color:var(--jade)}.need small{display:block;color:var(--sub);font-size:12px}
  /* 工具栏 */
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 14px;margin-bottom:14px;position:sticky;top:0;z-index:50}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tab{border:1px solid var(--line);background:#faf8f3;border-radius:20px;padding:5px 14px;font-size:13px;font-weight:700;cursor:pointer;color:var(--sub)}
  .tab.on{background:var(--jade);color:#fff;border-color:var(--jade)}
  .toolbar input[type=search],.toolbar select{border:1px solid var(--line);border-radius:9px;padding:6px 10px;font-size:13px;background:#fff;color:var(--ink)}
  .tool-btn{border:1px solid var(--jade);color:var(--jade);background:#fff;border-radius:9px;padding:6px 12px;font-size:12.5px;font-weight:700;cursor:pointer}
  .tool-btn.primary{background:var(--jade);color:#fff}
  .tool-btn.warn{border-color:var(--rose);color:var(--rose)}
  .spacer{flex:1}
  .hint-line{font-size:12px;color:var(--sub);margin:0 2px 14px}
  /* 候选卡 */
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(350px,1fr));gap:14px}
  .hc{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;border-left:5px solid var(--slate)}
  .hc.s-candidate{border-left-color:#b8b0a0}
  .hc.s-leaning{border-left-color:var(--clay)}
  .hc.s-booked{border-left-color:var(--jade)}
  .hc.s-out{border-left-color:var(--rose);opacity:.72}
  .hc-top{padding:13px 16px 9px;display:flex;gap:10px;align-items:flex-start}
  .hc-name{font-size:16.5px;font-weight:800;width:100%;border:none;border-bottom:1px dashed transparent;background:transparent;color:var(--ink);font-family:inherit;padding:1px 2px}
  .hc-name:focus{outline:none;border-bottom-color:var(--jade)}
  .hc-sub{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;align-items:center}
  .hc-sub input{border:none;background:transparent;color:var(--sub);font-size:12px;font-family:inherit;width:100%;min-width:90px;padding:1px 2px}
  .hc-sub input:focus{outline:none;background:#faf7ee;border-radius:5px}
  .pill2{font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;background:var(--slate-soft);color:var(--slate);white-space:nowrap}
  .pill2.tier-经济{background:#eef0f2;color:#69717c}.pill2.tier-中端{background:var(--sky-soft);color:var(--sky)}
  .pill2.tier-高端{background:var(--gold-soft);color:var(--gold)}.pill2.tier-民宿{background:var(--clay-soft);color:var(--clay)}
  /* 图片条 */
  .imgs{display:flex;gap:6px;overflow-x:auto;padding:0 16px 8px;scrollbar-width:thin}
  .imgs .ig{flex:none;width:86px;height:64px;border-radius:8px;object-fit:cover;border:1px solid var(--line);background:#eee;cursor:zoom-in}
  .imgs .add-img{flex:none;width:86px;height:64px;border:1.5px dashed #c9c2b3;border-radius:8px;display:grid;place-items:center;color:#a39a86;font-size:11px;cursor:pointer;background:#fbfaf6;text-align:center;line-height:1.3}
  /* 报价表 */
  .quote{margin:0 16px 10px;border:1px solid var(--line);border-radius:11px;overflow:hidden}
  .qrow{display:grid;grid-template-columns:64px 1fr auto;gap:8px;align-items:center;padding:7px 10px;border-bottom:1px solid var(--line);font-size:12.5px}
  .qrow:last-child{border-bottom:none}
  .qrow .pf{font-weight:800;color:var(--slate)}
  .qrow input.p{width:86px;border:1px solid var(--line);border-radius:7px;padding:3px 7px;font-size:12.5px;font-family:inherit}
  .qrow a.go{font-size:11.5px;font-weight:700;text-decoration:none;background:var(--sky-soft);color:var(--sky);padding:3px 9px;border-radius:20px;white-space:nowrap}
  .qrow .qd{font-size:10.5px;color:#a39a86}
  .q-missing{color:#a39a86;font-size:11px}
  /* 口碑/优劣 */
  .hc-body{padding:0 16px 12px;display:flex;flex-direction:column;gap:8px;flex:1}
  .field{font-size:12.5px}
  .field>b{display:block;font-size:11.5px;color:var(--sub);letter-spacing:.5px;margin-bottom:2px;font-weight:800}
  .field textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:12.5px;font-family:inherit;resize:vertical;line-height:1.55;color:var(--ink);background:#fdfcf9}
  .field textarea:focus{outline:none;border-color:var(--jade);background:#fff}
  .field .pro b{color:var(--jade)}.field .con b{color:var(--rose)}
  .tag-edit{font-size:11.5px;color:var(--sub)}
  /* 卡脚：状态 + 备注 */
  .hc-foot{border-top:1px solid var(--line);padding:10px 16px;background:#fbfaf6;display:flex;flex-direction:column;gap:8px}
  .statuses{display:flex;gap:6px;flex-wrap:wrap}
  .st{font-size:11.5px;font-weight:700;border:1px solid var(--line);background:#fff;border-radius:20px;padding:3px 11px;cursor:pointer;color:var(--sub)}
  .st.on.candidate{background:#b8b0a0;color:#fff;border-color:#b8b0a0}
  .st.on.leaning{background:var(--clay);color:#fff;border-color:var(--clay)}
  .st.on.booked{background:var(--jade);color:#fff;border-color:var(--jade)}
  .st.on.out{background:var(--rose);color:#fff;border-color:var(--rose)}
  .hc-foot input.note{width:100%;border:1px dashed #d3ccbd;border-radius:8px;background:transparent;padding:5px 9px;font-size:12px;font-family:inherit;color:var(--ink)}
  .hc-foot .meta-row{display:flex;justify-content:space-between;font-size:10.5px;color:#a39a86}
  .del{background:none;border:none;color:var(--rose);font-size:11px;cursor:pointer;text-decoration:underline}
  /* 对比区 */
  .cmp{display:none;margin-bottom:16px;background:#fff;border:2px solid var(--jade);border-radius:16px;padding:14px 16px}
  .cmp.show{display:block}
  .cmp table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:560px}
  .cmp-wrap{overflow-x:auto}
  .cmp th,.cmp td{border-bottom:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
  .cmp th{background:var(--jade-soft);color:var(--jade);white-space:nowrap}
  /* 灯箱 */
  .lb{position:fixed;inset:0;background:rgba(20,24,22,.82);display:none;align-items:center;justify-content:center;z-index:900;flex-direction:column;gap:10px;padding:20px}
  .lb.show{display:flex}
  .lb img{max-width:92vw;max-height:76vh;border-radius:10px}
  .lb .cap{color:#eee;font-size:13px;max-width:70vw;text-align:center}
  .lb button{position:absolute;top:18px;right:22px;background:rgba(255,255,255,.9);border:none;width:36px;height:36px;border-radius:50%;font-size:16px;cursor:pointer}
  /* 方法面板 */
  details.sop{background:#fff;border:1px solid var(--line);border-radius:14px;padding:4px 16px;margin-bottom:16px;font-size:13px}
  details.sop summary{cursor:pointer;font-weight:800;padding:10px 0;color:var(--slate)}
  details.sop ul{margin:0 0 12px 18px;color:var(--sub)}details.sop li{margin:3px 0}
  .saved-flag{font-size:11.5px;color:var(--jade);font-weight:700;opacity:0;transition:opacity .3s}
  .saved-flag.on{opacity:1}
  footer{text-align:center;color:var(--sub);font-size:11.5px;margin-top:36px}
  @media (max-width:640px){
    .wrap{padding:0 12px 60px}.hero{margin:0 -12px 16px;padding:26px 18px 22px}.hero h1{font-size:20px}
    .need{grid-template-columns:1fr;gap:8px}
    .toolbar{position:static;padding:10px;gap:8px}.cards{grid-template-columns:1fr}
    .qrow{grid-template-columns:56px 1fr auto;gap:6px}
  }
  /* ===== 纯展示：酒店/民宿分组 + 静态卡片 ===== */
  #cards{display:block}
  .grp-head{display:flex;align-items:baseline;gap:10px;font-size:17px;margin:18px 2px 12px;padding-bottom:8px;border-bottom:2px solid var(--line)}
  .grp-head small{color:var(--sub);font-size:12px;font-weight:400}
  .grp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(350px,1fr));gap:14px}
  .hc-name-static{font-size:16px;font-weight:700;line-height:1.35;padding-right:4px}
  .sblock{margin:9px 0}
  .sblock>.lbl{font-size:11.5px;color:var(--sub);margin-bottom:4px;letter-spacing:.3px}
  .chips{display:flex;flex-wrap:wrap;gap:5px}
  .chip{background:#f1ece0;border:1px solid var(--line);border-radius:20px;padding:2px 9px;font-size:11.5px;color:#6b6353}
  .slist{margin:0;padding-left:17px;font-size:12.5px;line-height:1.6}
  .slist.pro li{margin-bottom:2px}
  .slist.pro li::marker{color:#c0563f}
  .slist.con li::marker{color:#6a6457}
  .stext{font-size:12.5px;line-height:1.65;color:#3f3a30;white-space:pre-line;background:#faf7ee;border:1px solid var(--line);border-radius:8px;padding:7px 10px}
  .badge{font-size:11px;padding:1px 9px;border-radius:20px;border:1px solid var(--line);color:var(--sub)}
  .badge.leaning{color:var(--clay);border-color:var(--clay)}
  .badge.booked{color:var(--jade);border-color:var(--jade)}
  .badge.out{color:#9a9186;text-decoration:line-through}
  .hc.s-out{opacity:.7}
  .note-static{font-size:11.5px;color:#7a7261;line-height:1.55}
  @media (max-width:640px){.grp-grid{grid-template-columns:1fr}.grp-head{font-size:15px}}
</style>
</head>

Object.assign(SEED_QUOTES,Object.fromEntries(Object.entries(MCP_QUOTES).map(([k,v])=>[k,Object.assign(SEED_QUOTES[k],v)])));

/* ================= 状态 ================= */
/* ================= 数据（纯展示，不做本地编辑） ================= */
const quotes=structuredClone(SEED_QUOTES);
const hotels=structuredClone(SEED);
let cityFilter='all';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cityName=c=>(CITIES.find(x=>x[0]===c)||['',''])[1]||c;
const lines=s=>String(s||'').split('\n').filter(Boolean);
const STATUS_LABEL={candidate:'候选',leaning:'倾向',booked:'已订',out:'避坑/不选'};
const isBnb=h=>h.tier==='民宿';

/* ================= 渲染 ================= */
function renderNeed(){
  document.getElementById('needBar').innerHTML=CITIES.map(([c,name,n,note])=>{
    const list=hotels.filter(h=>h.city===c);
    const booked=list.find(h=>h.status==='booked'),lean=list.find(h=>h.status==='leaning');
    const st=booked?'<b style="color:var(--jade)">已订：'+esc(booked.name)+'</b>':lean?'<b style="color:var(--clay)">倾向：'+esc(lean.name)+'</b>':'<span style="color:var(--sub)">尚未决定</span>';
    return `<div class="n"><small>${name} · 需 ${n} 晚</small>${st}<small>${esc(note)}</small></div>`;
  }).join('');
}
function renderTabs(){
  const all=[['all','全部'],...CITIES.map(c=>[c[0],c[1]])];
  document.getElementById('cityTabs').innerHTML=all.map(([k,v])=>`<button class="tab ${cityFilter===k?'on':''}" data-c="${k}">${v}</button>`).join('');
}
function visibleHotels(){
  const kw=document.getElementById('search').value.trim().toLowerCase();
  const sort=document.getElementById('sort').value;
  let arr=hotels.filter(h=>cityFilter==='all'||h.city===cityFilter)
    .filter(h=>!kw||[h.name,h.en,h.area,h.tags,h.colleague,h.xhs,h.note].join(' ').toLowerCase().includes(kw));
  const qmin=h=>Math.min(...PLATFORMS.map(([k])=>quotes[h.id]?.[k]?.price||Infinity),isFinite(h.refPrice)&&h.refPrice?h.refPrice:Infinity);
  const sRank={booked:0,leaning:1,candidate:2,out:3};
  arr.sort((a,b)=>{
    if(sort==='price')return qmin(a)-qmin(b);
    if(sort==='rating')return(b.rating||0)-(a.rating||0);
    if(sort==='city')return a.city.localeCompare(b.city)||sRank[a.status]-sRank[b.status];
    return sRank[a.status]-sRank[b.status]||a.city.localeCompare(b.city);
  });
  return arr;
}
function cardHtml(h){
  const q=quotes[h.id]||{};
  const qrows=PLATFORMS.map(([k,label])=>{
    const x=q[k]||{};
    const searchUrl=PLATFORM_SEARCH[k](h.en||h.name,h.city);
    const cell=x.price!=null?`<b>¥${x.price}/晚</b> <span class="qd">${esc(x.date||'')}</span>`:'<span class="q-missing">未采集到报价</span>';
    return `<div class="qrow"><span class="pf">${label}</span><span>${cell}</span><a class="go" href="${x.url||searchUrl}" target="_blank" rel="noopener">${x.price!=null?'打开 ↗':'去查 ↗'}</a></div>`;
  }).join('');
  const imgs=(h.imgs||[]).map(im=>`<img class="ig" loading="lazy" src="${im.src}" data-cap="${esc(im.cap||'')}" alt="${esc(im.cap||'')}">`).join('');
  const chips=String(h.tags||'').split(/[,，]/).map(t=>t.trim()).filter(Boolean).map(t=>`<span class="chip">${esc(t)}</span>`).join('');
  const ul=(cls,val)=>{const a=lines(val);return a.length?`<ul class="slist ${cls}">${a.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'<div class="qd">—</div>'};
  const block=(lbl,val)=>val?`<div class="sblock"><div class="lbl">${lbl}</div><div class="stext">${esc(val)}</div></div>`:'';
  return `<article class="hc s-${h.status}" data-id="${h.id}">
    <div class="hc-top"><div style="flex:1;min-width:0">
      <div class="hc-name-static">${esc(h.name)}</div>
      <div class="hc-sub">
        <span class="pill2 tier-${h.tier}">${h.tier}</span>
        ${h.area?`<span class="chip">${esc(h.area)}</span>`:''}
        ${h.nights?`<span class="pill2">${esc(h.nights)}</span>`:''}
        <span class="chip">${cityName(h.city)}</span>
        ${h.status!=='candidate'?`<span class="badge ${h.status}">${STATUS_LABEL[h.status]||''}</span>`:''}
      </div>
    </div></div>
    ${imgs?`<div class="imgs">${imgs}</div>`:''}
    <div class="quote">${qrows}
      <div class="qrow"><span class="pf">攻略参考</span><span>${h.refPrice?`¥${h.refPrice}/晚（采集 ${h.mcpDate||''}）`:'<span class="q-missing">团费含/待查</span>'}</span><span class="qd">${h.rating?h.rating+' 分':''}</span></div>
    </div>
    <div class="hc-body">
      ${chips?`<div class="sblock"><div class="lbl">亮点标签</div><div class="chips">${chips}</div></div>`:''}
      <div class="sblock"><div class="lbl">🟥 优势 / 红经验</div>${ul('pro',h.pros)}</div>
      <div class="sblock"><div class="lbl">🖤 劣势 / 避坑</div>${ul('con',h.cons)}</div>
      ${block('同事文档 / 内网群原话',h.colleague)}
      ${block('小红书口碑（正文 + 评论）',h.xhs)}
    </div>
    ${h.note?`<div class="hc-foot"><div class="note-static">📝 ${esc(h.note)}</div></div>`:''}
  </article>`;
}
function renderCards(){
  const arr=visibleHotels();
  const groups=[
    ['酒店 / 连锁与品牌公寓',arr.filter(h=>!isBnb(h))],
    ['民宿 / 公寓（Airbnb 与小红书高评）',arr.filter(isBnb)],
  ];
  document.getElementById('cards').innerHTML=groups
    .filter(([,list])=>list.length)
    .map(([title,list])=>`<section class="grp"><h2 class="grp-head"><span>${title}</span><small>${list.length} 家</small></h2><div class="grp-grid">${list.map(cardHtml).join('')}</div></section>`)
    .join('');
}
function renderAll(){renderNeed();renderTabs();renderCards()}

/* ================= 事件（仅筛选 / 排序 / 图片放大） ================= */
document.getElementById('cityTabs').addEventListener('click',e=>{const t=e.target.closest('.tab');if(!t)return;cityFilter=t.dataset.c;renderAll()});
['search','sort'].forEach(id=>document.getElementById(id).addEventListener('input',renderCards));
document.getElementById('cards').addEventListener('click',e=>{
  if(e.target.classList.contains('ig')){document.getElementById('lbImg').src=e.target.src;document.getElementById('lbCap').textContent=e.target.dataset.cap||'';document.getElementById('lb').classList.add('show')}
});
document.getElementById('lbClose').addEventListener('click',()=>document.getElementById('lb').classList.remove('show'));
document.getElementById('lb').addEventListener('click',e=>{if(e.target.id==='lb')e.currentTarget.classList.remove('show')});

renderAll();
</script>
